name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Lint (ruff)
        working-directory: scripts
        run: >
          uv run --with ruff ruff check --config ruff.toml
          srlib soulreap.py hint.py conftest.py repo_fixtures.py
      - name: Tests (pytest)
        working-directory: scripts
        run: >
          uv run --with pytest --with pygraphviz --with pathspec
          --with tree-sitter-language-pack pytest -q
